services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streammind}
      POSTGRES_USER: ${POSTGRES_USER:-streammind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streammind_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://streammind:streammind_dev_password@postgres:5432/streammind}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-before-deploying}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-streammind-original-videos}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      PRESIGNED_UPLOAD_EXPIRE_SECONDS: ${PRESIGNED_UPLOAD_EXPIRE_SECONDS:-900}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
volumes:
  postgres-data:
