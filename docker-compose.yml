services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streammind}
      POSTGRES_USER: ${POSTGRES_USER:-streammind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streammind_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streammind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streammind_dev_secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streammind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streammind_dev_secret}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-streammind-original-videos}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET:-streammind-processed-videos}
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
      mc mb --ignore-existing "local/$${S3_UPLOAD_BUCKET}";
      mc mb --ignore-existing "local/$${S3_PROCESSED_BUCKET}";
      mc anonymous set none "local/$${S3_UPLOAD_BUCKET}";
      mc anonymous set none "local/$${S3_PROCESSED_BUCKET}";
      '
  elasticmq:
    image: softwaremill/elasticmq-native@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
      - elasticmq-data:/data
    command: -Dconfig.file=/opt/elasticmq.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9324/?Action=ListQueues&Version=2012-11-05"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://streammind:streammind_dev_password@postgres:5432/streammind}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-before-deploying}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-streammind-original-videos}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET:-streammind-processed-videos}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      PRESIGNED_UPLOAD_EXPIRE_SECONDS: ${PRESIGNED_UPLOAD_EXPIRE_SECONDS:-900}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-streammind}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-streammind_dev_secret}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      VIDEO_PROCESSING_QUEUE_URL: ${VIDEO_PROCESSING_QUEUE_URL:-http://elasticmq:9324/000000000000/video-processing}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  video-worker:
    build:
      context: .
      dockerfile: workers/video_processor/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://streammind:streammind_dev_password@postgres:5432/streammind}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-streammind-original-videos}
      S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET:-streammind-processed-videos}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-streammind}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-streammind_dev_secret}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://elasticmq:9324}
      VIDEO_PROCESSING_QUEUE_URL: ${VIDEO_PROCESSING_QUEUE_URL:-http://elasticmq:9324/000000000000/video-processing}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-7200}
    depends_on:
      backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
volumes:
  postgres-data:
  minio-data:
  elasticmq-data:
